# MoneyMate Render Deployment Configuration
# This file defines the Render services for frontend and backend

services:
  # Frontend (React SPA)
  - type: web
    name: moneymate-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://moneymate-backend-oclv.onrender.com
      - key: VITE_DEBUG
        value: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend (FastAPI)
  - type: web
    name: moneymate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql+psycopg2://user:password@host:port/database"
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
        length: 64
      - key: CORS_ORIGINS
        value: https://moneymate-frontend-oclv.onrender.com,https://moneymate-frontend-xd3o.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 20
      - key: DB_POOL_RECYCLE
        value: 3600
